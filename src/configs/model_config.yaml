# PhyDiff-Net Model Configuration
# Physics-guided Diffusion Network for Precipitation Forecasting

model:
  name: "PhyDiff-Net"
  hidden_dim: 192
  num_scales: 3
  num_diffusion_steps: 1000
  dropout_rate: 0.1

  encoder:
    in_channels: 10  # ERA5 variable count
    hidden_dim: 192
    num_heads: 8
    num_scales: 3

  diffusion:
    hidden_dim: 192
    num_res_blocks: 4
    attention_resolutions: [16, 8]
    num_diffusion_steps: 1000
    beta_start: 0.0001
    beta_end: 0.02

  extreme_branch:
    hidden_dim: 192
    num_layers: 4
    thresholds: [25.0, 50.0, 100.0]
    weights:
      heavy: 1.0
      very_heavy: 2.0
      extreme: 5.0

  heterogeneity:
    hidden_dim: 192
    num_regions: 4
    num_frequencies: 8
    num_heads: 8

  output:
    hidden_dim: 192
    output_channels: 1
    forecast_horizon: 4

training:
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 400
  warmup_epochs: 10
  gradient_clip: 1.0

  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    min_lr: 1.0e-6

data:
  input_resolution: 0.1  # degrees
  temporal_resolution: 6  # hours
  input_sequence_length: 12  # time steps
  forecast_horizon: 4  # time steps (24 hours)

augmentation:
  spatial_flip: true
  spatial_rotation: true
  temporal_shift: true
  physics_consistent: true

loss:
  mse_weight: 0.2
  huber_weight: 0.1
  focal_weight: 0.15
  csi_weight: 0.25
  quantile_weight: 0.1
  physics_weight: 0.1
  extreme_weight: 0.1
  csi_thresholds: [0.1, 5.0, 10.0, 25.0, 50.0]
  quantile_quantiles: [0.1, 0.5, 0.9]
