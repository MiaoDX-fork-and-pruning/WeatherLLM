# E4: full-data dual-source training (2000-2016 train / 2017 val / 2019H2 test).
# era5_path points to the directory of merged yearly files (era5_2000.nc ..
# era5_2017.nc + era5_2018-2019.nc); GMCPERA5Dataset concatenates them lazily
# and computes only the China-region slice.

model:
  name: "PhyDiff-Net-DualSource-Full"
  use_era5: true
  hidden_dim: 192
  num_scales: 3
  num_diffusion_steps: 1000
  dropout_rate: 0.1
  encoder_spatial_size: [64, 64]

  encoder:
    in_channels: 17
    gmcp_channels: 12
    hidden_dim: 192
    num_heads: 8
    num_scales: 3

  diffusion:
    hidden_dim: 192
    num_res_blocks: 4
    attention_resolutions: [16, 8]
    num_diffusion_steps: 1000
    beta_start: 0.0001
    beta_end: 0.02

  extreme_branch:
    hidden_dim: 192
    num_layers: 4
    thresholds: [25.0, 50.0, 100.0]

  heterogeneity:
    hidden_dim: 192
    num_regions: 4
    num_frequencies: 8
    num_heads: 8

  output:
    hidden_dim: 192
    output_channels: 1
    forecast_horizon: 4

training:
  batch_size: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 8
  min_lr: 1.0e-6
  gradient_clip: 1.0
  num_workers: 0
  gpu_id: 0
  seed: 42
  output_dir: "outputs/gmcp_era5_full"
  mse_weight: 1.0
  mae_weight: 0.5
  csi_weight: 0.5
  extreme_weight: 1.0

data:
  era5_path: "F:/WeatherBench2_ERA5"
  gmcp_path: "F:/GMCP_Precipitation_6h"
  input_timesteps: 12
  forecast_horizon: 4
  normalize: "log_minmax"

  splits:
    train:
      start_date: "2000-01-01"
      end_date: "2016-12-31"
    val:
      start_date: "2017-01-01"
      end_date: "2017-12-31"
    test:
      start_date: "2019-07-01"
      end_date: "2019-12-31"
