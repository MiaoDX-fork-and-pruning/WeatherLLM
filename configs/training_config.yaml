# ==============================================================================
# PhyDiff-Net Training Configuration
# ==============================================================================
# Multi-stage progressive training configuration for precipitation forecasting
# over China using ERA5 reanalysis and GMCP precipitation data.
# ==============================================================================

# ---- General training settings ----
training:
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 400
  warmup_epochs: 10
  gradient_clip: 1.0

  # Optimizer configuration
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8

  # Learning rate scheduler
  scheduler:
    type: "cosine_with_warmup"
    min_lr: 1.0e-6

  # ---- Multi-stage training ----
  stages:
    # Stage 1: Learn general atmospheric representations from ERA5
    pretrain:
      epochs: 50
      lr: 1.0e-4
      description: "Stage 1: Learn general atmospheric representations from ERA5"
      data: "era5"
      loss_weights:
        mse: 0.5
        reconstruction: 0.5

    # Stage 2: Learn ERA5-GMCP fusion representations
    fusion_pretrain:
      epochs: 100
      lr: 5.0e-5
      description: "Stage 2: Learn ERA5-GMCP fusion representations"
      data: "era5_gmcp"
      loss_weights:
        mse: 0.3
        csi: 0.3
        physics: 0.2
        reconstruction: 0.2

    # Stage 3: Optimize precipitation forecasting performance
    finetune:
      epochs: 200
      lr: 1.0e-4
      description: "Stage 3: Optimize precipitation forecasting performance"
      data: "era5_gmcp"
      loss_weights:
        mse: 0.2
        csi: 0.25
        focal: 0.15
        quantile: 0.1
        physics: 0.1
        extreme: 0.1
        huber: 0.1

    # Stage 4: Enhance extreme event prediction capability
    extreme_enhance:
      epochs: 50
      lr: 2.0e-4
      description: "Stage 4: Enhance extreme event prediction capability"
      data: "extreme_oversampled"
      loss_weights:
        mse: 0.15
        csi: 0.2
        extreme: 0.35
        physics: 0.15
        focal: 0.15

  # Distributed training
  distributed:
    enabled: false
    backend: "nccl"
    find_unused_parameters: false

  # Mixed precision training
  mixed_precision:
    enabled: true
    dtype: "float16"
    loss_scale: "dynamic"

  # Checkpointing
  checkpoint:
    save_dir: "checkpoints"
    save_every_n_epochs: 10
    keep_last_n_checkpoints: 5
    save_best_only: false

  # Logging
  logging:
    log_dir: "logs"
    log_every_n_steps: 50
    tensorboard: true
    wandb: false
    wandb_project: "phydiff-net"

  # Validation
  validation:
    validate_every_n_epochs: 5
    early_stopping_patience: 30
    monitor_metric: "val_extreme_csi"
    mode: "max"

  # Reproducibility
  seed: 42
  deterministic: true
  benchmark: true

# ---- Model configuration (reference) ----
# See src/configs/model_config.yaml for detailed model architecture settings.
model:
  hidden_dim: 192
  num_scales: 3
  num_diffusion_steps: 1000
  dropout_rate: 0.1

# ---- Data configuration (reference) ----
# See src/configs/data_config.yaml for detailed data pipeline settings.
data:
  input_resolution: 0.1
  temporal_resolution: 6
  input_sequence_length: 12
  forecast_horizon: 4
  crop_size: 128

# ---- Loss function configuration ----
loss:
  # Regression losses
  mse_weight: 0.2
  huber_weight: 0.1
  huber_delta: 10.0

  # Classification / detection losses
  focal_weight: 0.15
  focal_gamma: 2.0
  focal_alpha: 0.25

  # Threshold-based detection
  csi_weight: 0.25
  csi_thresholds: [0.1, 5.0, 10.0, 25.0, 50.0]

  # Distributional accuracy
  quantile_weight: 0.1
  quantiles: [0.1, 0.5, 0.9]

  # Physical consistency
  physics_weight: 0.1

  # Extreme event handling
  extreme_weight: 0.1
  extreme_thresholds:
    heavy: 25.0
    very_heavy: 50.0
    extreme: 100.0
  extreme_weights:
    heavy: 1.0
    very_heavy: 2.0
    extreme: 5.0
