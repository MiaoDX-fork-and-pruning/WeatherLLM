# ERA5 Data Preprocessing Configuration
# PhyDiff-Net precipitation forecasting model

# =============================================================================
# Input Data Settings
# =============================================================================
input:
  # ERA5 raw data directory (NetCDF files)
  era5_path: "F:/ERA5再分析数据下载"

  # ERA5 data resolution (degrees)
  era5_resolution: 0.25

  # Variables to extract from ERA5
  variables:
    - "temperature"          # 2m temperature (K)
    - "u_wind"              # 10m u-component of wind (m/s)
    - "v_wind"              # 10m v-component of wind (m/s)
    - "geopotential"        # Geopotential (m^2/s^2)
    - "relative_humidity"   # Relative humidity (%)
    - "surface_pressure"    # Surface pressure (Pa)
    - "total_precipitation" # Total precipitation (m)

  # Pressure levels to include (hPa)
  pressure_levels:
    - 500
    - 700
    - 850
    - 1000

# =============================================================================
# Spatial Settings
# =============================================================================
spatial:
  # Target resolution after interpolation (degrees)
  target_resolution: 0.1

  # Spatial cropping bounds (optional, set to null to disable)
  # Default: China region (73E-135E, 18N-54N)
  crop:
    enabled: true
    lat_min: 18.0
    lat_max: 54.0
    lon_min: 73.0
    lon_max: 135.0

  # Output grid dimensions after cropping
  output_height: 360   # latitude points
  output_width: 620    # longitude points

# =============================================================================
# Temporal Settings
# =============================================================================
temporal:
  # Original ERA5 temporal resolution (hours)
  original_resolution: 1

  # Target temporal resolution (hours)
  target_resolution: 6

  # Time series configuration for sequence-to-sequence forecasting
  sequence:
    # Number of historical frames as input (N)
    history_length: 4    # 4 x 6h = 24 hours of history

    # Number of future frames to predict (M)
    forecast_length: 4   # 4 x 6h = 24 hours forecast

  # Aggregation method for temporal downsampling
  aggregation_method: "mean"  # mean, sum, or max

# =============================================================================
# Normalization Settings
# =============================================================================
normalization:
  # Method: zscore (mean=0, std=1) or minmax (0-1 range)
  method: "zscore"

  # Whether to compute statistics from training data only
  compute_from_train_only: true

  # Clip outliers beyond this many standard deviations
  clip_sigma: 5.0

# =============================================================================
# Dataset Split Settings
# =============================================================================
split:
  # Time periods for train/val/test splits
  train_period:
    start: "2000-01-01"
    end: "2019-12-31"

  val_period:
    start: "2020-01-01"
    end: "2022-12-31"

  test_period:
    start: "2023-01-01"
    end: "2024-12-31"

  # Random seed for reproducibility
  random_seed: 42

# =============================================================================
# Output Settings
# =============================================================================
output:
  # Output directory for processed data
  output_dir: "F:/ERA5再分析数据/processed"

  # Output format: 'pt' (PyTorch), 'npy' (NumPy), or 'zarr'
  format: "pt"

  # Compression for output files
  compression: true

  # Save normalization statistics
  save_stats: true

  # File naming convention
  naming:
    prefix: "era5"
    separator: "_"

# =============================================================================
# Processing Options
# =============================================================================
processing:
  # Number of parallel workers for data loading
  num_workers: 4

  # Memory-mapped loading for large datasets
  mmap_mode: false

  # Verbose logging
  verbose: true

  # Validate data quality after processing
  validate_output: true

# =============================================================================
# Quality Control Thresholds
# =============================================================================
quality_control:
  temperature:
    min: 150.0
    max: 350.0
  u_wind:
    min: -100.0
    max: 100.0
  v_wind:
    min: -100.0
    max: 100.0
  geopotential:
    min: -5000.0
    max: 100000.0
  relative_humidity:
    min: 0.0
    max: 100.0
  surface_pressure:
    min: 30000.0
    max: 110000.0
  total_precipitation:
    min: 0.0
    max: 500.0
