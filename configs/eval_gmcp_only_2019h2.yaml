# Fair-comparison config: evaluate the GMCP-only baseline checkpoint on the
# same 2019H2 test split used for the dual-source model (E3 ablation).
# Model section mirrors configs/training_gmcp_subset.yaml (GMCP-only mode).

model:
  name: "PhyDiff-Net-GMCP-Subset"
  use_era5: false
  hidden_dim: 192
  num_scales: 3
  num_diffusion_steps: 1000
  dropout_rate: 0.1
  encoder_spatial_size: [64, 64]

  encoder:
    in_channels: 19
    gmcp_channels: 12
    hidden_dim: 192
    num_heads: 8
    num_scales: 3

  diffusion:
    hidden_dim: 192
    num_res_blocks: 4
    attention_resolutions: [16, 8]
    num_diffusion_steps: 1000
    beta_start: 0.0001
    beta_end: 0.02

  extreme_branch:
    hidden_dim: 192
    num_layers: 4
    thresholds: [25.0, 50.0, 100.0]

  heterogeneity:
    hidden_dim: 192
    num_regions: 4
    num_frequencies: 8
    num_heads: 8

  output:
    hidden_dim: 192
    output_channels: 1
    forecast_horizon: 4

training:
  output_dir: "outputs/gmcp_eval_2019h2"

data:
  data_path: "F:/GMCP_Precipitation_6h"
  use_preprocessed: true
  input_timesteps: 12
  forecast_horizon: 4
  normalize: "log_minmax"
  splits:
    train:
      start_date: "2019-07-01"
      end_date: "2019-12-31"
    val:
      start_date: "2019-07-01"
      end_date: "2019-12-31"
    test:
      start_date: "2019-07-01"
      end_date: "2019-12-31"
